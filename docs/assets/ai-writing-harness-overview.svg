<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">AI 写作自动化 Harness 全景信息图</title>
  <desc id="desc">白色背景信息图，展示 writing-agent-harness 的输入、路由、技能执行、canonical source、渠道输出和自我进化闭环。</desc>
  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#fffaf1"/>
    </linearGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="cool" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#0f172a" opacity="0.08"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#19324d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 12 7 L 1 13 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 12 7 L 1 13 Z" fill="#f59e0b"/>
    </marker>
    <style>
      .cn { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", ui-sans-serif, sans-serif; letter-spacing: 0; }
      .serif { font-family: "Songti SC", "Noto Serif CJK SC", Georgia, serif; letter-spacing: 0; }
      .mono { font-family: "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace; letter-spacing: 0; }
      .title { font-size: 58px; font-weight: 800; fill: #111827; }
      .subtitle { font-size: 23px; fill: #475569; }
      .eyebrow { font-size: 15px; font-weight: 800; fill: #2563eb; letter-spacing: 1.4px; }
      .cardTitle { font-size: 30px; font-weight: 800; fill: #111827; }
      .body { font-size: 20px; fill: #334155; }
      .small { font-size: 17px; fill: #475569; }
      .tiny { font-size: 14px; fill: #64748b; }
      .card { fill: #ffffff; stroke: #dbe5ef; stroke-width: 1.4; }
      .softCard { fill: #f8fbff; stroke: #dbe5ef; stroke-width: 1.2; }
      .chip { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.1; }
      .blueChip { fill: #eff6ff; stroke: #bfdbfe; }
      .tealChip { fill: #ecfdf5; stroke: #99f6e4; }
      .amberChip { fill: #fffbeb; stroke: #fde68a; }
      .purpleChip { fill: #f5f3ff; stroke: #ddd6fe; }
      .flow { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1800" height="1000" fill="url(#paper)"/>
  <rect width="1800" height="1000" fill="url(#dotGrid)"/>
  <circle cx="915" cy="500" r="392" fill="#0ea5e9" opacity="0.045"/>
  <circle cx="915" cy="500" r="272" fill="#f59e0b" opacity="0.045"/>

  <g class="cn">
    <text x="96" y="102" class="eyebrow">PERSONAL AI WRITING AUTOMATION HARNESS</text>
    <text x="96" y="164" class="title serif">AI 写作自动化工作台</text>
    <text x="99" y="207" class="subtitle">把灵感、研究、写作、配图、排版、分发和复盘，组织成可追踪、可验证、可进化的 agent harness。</text>
  </g>

  <g filter="url(#cardShadow)" class="cn">
    <rect x="96" y="284" width="360" height="412" rx="30" class="card"/>
    <text x="132" y="334" class="eyebrow">01 输入入口</text>
    <text x="132" y="377" class="cardTitle">原始素材进入</text>
    <text x="132" y="412" class="small">不要求一开始就整洁，先让材料可被 agent 接住。</text>

    <rect x="132" y="455" width="288" height="52" rx="16" class="chip blueChip"/>
    <text x="154" y="489" class="body">飞书 / Notion 文档</text>
    <rect x="132" y="523" width="288" height="52" rx="16" class="chip tealChip"/>
    <text x="154" y="557" class="body">灵感碎片、截图、笔记</text>
    <rect x="132" y="591" width="288" height="52" rx="16" class="chip amberChip"/>
    <text x="154" y="625" class="body">网页研究与事实查证</text>
  </g>

  <g filter="url(#cardShadow)" class="cn">
    <rect x="1344" y="284" width="360" height="412" rx="30" class="card"/>
    <text x="1380" y="334" class="eyebrow">05 渠道输出</text>
    <text x="1380" y="377" class="cardTitle">一稿多端派生</text>
    <text x="1380" y="412" class="small">渠道稿同 slug，用 source 回链到 canonical source。</text>

    <rect x="1380" y="455" width="288" height="52" rx="16" class="chip tealChip"/>
    <text x="1402" y="489" class="body">微信公众号草稿箱</text>
    <rect x="1380" y="523" width="288" height="52" rx="16" class="chip blueChip"/>
    <text x="1402" y="557" class="body">博客 / Astro 主阵地</text>
    <rect x="1380" y="591" width="288" height="52" rx="16" class="chip purpleChip"/>
    <text x="1402" y="625" class="body">未来分发渠道</text>
  </g>

  <g filter="url(#cardShadow)" class="cn">
    <rect x="610" y="276" width="580" height="448" rx="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="658" y="324" width="484" height="96" rx="24" fill="#f8fafc" stroke="#dbe5ef"/>
    <text x="690" y="360" class="eyebrow">02 路由层</text>
    <text x="690" y="394" class="body">AGENTS.md 决定先读哪些 docs / skills，避免 agent 迷路。</text>

    <circle cx="900" cy="528" r="132" fill="url(#core)"/>
    <circle cx="900" cy="528" r="103" fill="#ffffff" opacity="0.96"/>
    <text x="900" y="489" text-anchor="middle" class="eyebrow">03 Canonical Source</text>
    <text x="900" y="532" text-anchor="middle" class="cardTitle">Markdown / MDX</text>
    <text x="900" y="568" text-anchor="middle" class="mono body">content/source/</text>
    <text x="900" y="599" text-anchor="middle" class="tiny">repo 内长期可信源稿</text>

    <rect x="658" y="642" width="220" height="52" rx="17" class="chip amberChip"/>
    <text x="768" y="676" text-anchor="middle" class="small">SOUL.md 作者声音</text>
    <rect x="922" y="642" width="220" height="52" rx="17" class="chip blueChip"/>
    <text x="1032" y="676" text-anchor="middle" class="small">readiness + preview</text>
  </g>

  <g filter="url(#cardShadow)" class="cn">
    <rect x="520" y="776" width="760" height="112" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="558" y="820" class="eyebrow">06 自我进化闭环</text>
    <text x="558" y="856" class="body">closeout → 复盘 → docs 更新 → skill/script 修复 → 下一次更稳</text>
  </g>

  <g filter="url(#cardShadow)" class="cn">
    <rect x="1084" y="82" width="620" height="116" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="1122" y="124" class="eyebrow">04 Skills 执行层</text>
    <text x="1122" y="160" class="body">选题、润色、插图、视频、微信排版、草稿同步</text>
    <text x="1122" y="188" class="body">和发布后收尾，都沉淀为可复用 project skills。</text>
  </g>

  <g class="cn">
    <path d="M 456 482 C 526 454, 544 386, 610 372" class="flow" stroke="url(#cool)" stroke-width="8" marker-end="url(#arrowBlue)"/>
    <path d="M 456 582 C 520 612, 548 659, 610 676" class="flow" stroke="url(#warm)" stroke-width="6" marker-end="url(#arrowOrange)"/>
    <path d="M 1190 404 C 1250 420, 1280 458, 1344 482" class="flow" stroke="url(#cool)" stroke-width="8" marker-end="url(#arrowBlue)"/>
    <path d="M 1190 650 C 1256 632, 1284 592, 1344 582" class="flow" stroke="url(#warm)" stroke-width="6" marker-end="url(#arrowOrange)"/>
    <path d="M 1350 676 C 1308 770, 1240 832, 1280 832" class="flow" stroke="#f59e0b" stroke-width="5" marker-end="url(#arrowOrange)"/>
    <path d="M 520 832 C 378 792, 315 704, 276 696" class="flow" stroke="#14b8a6" stroke-width="5" marker-end="url(#arrowBlue)"/>
  </g>

  <g class="cn">
    <rect x="107" y="738" width="324" height="82" rx="22" fill="#f8fafc" stroke="#dbe5ef"/>
    <text x="132" y="771" class="eyebrow">本地 scratch</text>
    <text x="132" y="803" class="small">inbox / drafts 默认本地，不提交 Git</text>

    <rect x="1370" y="738" width="302" height="82" rx="22" fill="#f8fafc" stroke="#dbe5ef"/>
    <text x="1396" y="771" class="eyebrow">发布边界</text>
    <text x="1396" y="803" class="small">agent 可建草稿，最终发布人工确认</text>
  </g>
</svg>
