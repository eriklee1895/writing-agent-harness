<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
      <rect width="800" height="280" fill="#ffffff"/>

  <!-- Outer canvas representing the original input image -->
  <rect x="40" y="30" width="400" height="200" rx="2" ry="2"
        fill="#f5f5f4" stroke="#9ca3af" stroke-width="2"/>
  <text x="48" y="50" font-size="12" fill="#6b7280" font-style="italic">Original image</text>

  <!-- Semi-transparent red marker rectangle (alpha=80 ≈ 31%) -->
  <rect x="160" y="80" width="220" height="100"
        fill="#ff0000" fill-opacity="0.314"
        stroke="#ff0000" stroke-width="3"/>
  <!-- Inner text label inside the red box -->
  <text x="270" y="125" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">标题文字</text>
  <text x="270" y="152" font-size="16" fill="#374151" text-anchor="middle">在这里换</text>

  <!-- Right-side annotation: arrow pointing to the red box + legend -->
  <line x1="385" y1="130" x2="490" y2="130" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="385,130 392,127 392,133" fill="#9ca3af"/>
      <text x="495" y="125" font-size="12" font-weight="600" fill="#dc2626">半透明彩色矩形（默认红 #ff0000）</text>
      <text x="495" y="142" font-size="11" fill="#6b7280">alpha=80, stroke=3px</text>

  <!-- Bottom caption: image is sent as base64 in image field -->
  <line x1="240" y1="232" x2="240" y2="250" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="240,250 237,243 243,243" fill="#9ca3af"/>
  <text x="240" y="268" font-size="12" fill="#6b7280" text-anchor="middle">被作为 <tspan font-family="Menlo, Consolas, monospace" fill="#374151">`image`</tspan> 字段 base64 上传</text>
</svg>
