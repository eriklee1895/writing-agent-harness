<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="title desc">
  <title id="title">One published Environment, independent Tasks</title>
  <desc id="desc">A reusable Environment contains repositories, dependencies, tools, and access settings. New Tasks reuse the prepared filesystem while keeping separate workspaces and working state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#7e8880" stroke-width="1.5"/></marker>
    <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#24332c}.label{font-size:23px;font-weight:650}.body{font-size:17px;fill:#617067}.tag{font-size:16px}.small{font-size:15px;fill:#617067}.green{fill:#38654e}</style>
  </defs>
  <rect x="1" y="1" width="898" height="528" rx="20" fill="#fafbf8" stroke="#dfe5dc"/>
  <text x="38" y="39" class="small">REUSABLE SETUP</text>
  <rect x="50" y="59" width="800" height="158" rx="16" fill="#eef3ec" stroke="#cddbc9"/>
  <text x="450" y="96" text-anchor="middle" class="label">Published Environment</text>
  <text x="450" y="126" text-anchor="middle" class="body">Repositories · Dependencies · Tools · Access settings</text>
  <rect x="278" y="148" width="100" height="37" rx="18" fill="#fff" stroke="#d8e2d4"/>
  <rect x="400" y="148" width="100" height="37" rx="18" fill="#fff" stroke="#d8e2d4"/>
  <rect x="522" y="148" width="100" height="37" rx="18" fill="#fff" stroke="#d8e2d4"/>
  <text x="328" y="172" text-anchor="middle" class="tag">Repo A</text>
  <text x="450" y="172" text-anchor="middle" class="tag">Repo B</text>
  <text x="572" y="172" text-anchor="middle" class="tag">Repo C</text>
  <path d="M450 218V254H180V300 M450 254V300 M450 254H720V300" stroke="#7e8880" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M180 284V300" stroke="#7e8880" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M450 284V300" stroke="#7e8880" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="293" y="236" width="314" height="34" rx="17" fill="#fafbf8"/>
  <text x="450" y="259" text-anchor="middle" class="small">Reuse the prepared filesystem</text>
  <rect x="60" y="309" width="240" height="161" rx="15" fill="#fff" stroke="#d8e0d5"/>
  <rect x="330" y="309" width="240" height="161" rx="15" fill="#fff" stroke="#d8e0d5"/>
  <rect x="600" y="309" width="240" height="161" rx="15" fill="#fff" stroke="#d8e0d5"/>
  <text x="180" y="350" text-anchor="middle" class="label">Task A</text>
  <text x="450" y="350" text-anchor="middle" class="label">Task B</text>
  <text x="720" y="350" text-anchor="middle" class="label">Task C</text>
  <text x="180" y="380" text-anchor="middle" class="body">Fix a bug</text>
  <text x="450" y="380" text-anchor="middle" class="body">Add tests</text>
  <text x="720" y="380" text-anchor="middle" class="body">Explore the code</text>
  <rect x="87" y="404" width="186" height="35" rx="17" fill="#edf4ed"/>
  <rect x="357" y="404" width="186" height="35" rx="17" fill="#edf4ed"/>
  <rect x="627" y="404" width="186" height="35" rx="17" fill="#edf4ed"/>
  <text x="180" y="427" text-anchor="middle" class="tag green">Separate workspace</text>
  <text x="450" y="427" text-anchor="middle" class="tag green">Separate workspace</text>
  <text x="720" y="427" text-anchor="middle" class="tag green">Separate workspace</text>
  <text x="450" y="503" text-anchor="middle" class="small">Shared preparation · Independent files and working state</text>
</svg>
