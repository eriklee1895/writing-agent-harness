<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690" role="img" aria-labelledby="title desc">
  <title id="title">Network Secret: placeholder in the Task, real credential at the Proxy</title>
  <desc id="desc">The Task receives a placeholder and sends it in an HTTPS request. A trusted Network Proxy matches an allowed destination and substitutes the configured real credential. The upstream service receives the real credential. This is a conceptual model, not a production deployment topology.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#75837a" stroke-width="1.6"/></marker>
    <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#24332c}.label{font-size:23px;font-weight:650}.body{font-size:17px;fill:#5c6d61}.small{font-size:15px;fill:#647369}.code{font-family:'SFMono-Regular',Consolas,monospace;font-size:17px}.green{fill:#35664d}</style>
  </defs>
  <rect x="1" y="1" width="898" height="688" rx="20" fill="#fafbf8" stroke="#dfe5dc"/>
  <text x="37" y="39" class="small">CREDENTIAL DELIVERY · CONCEPTUAL MODEL</text>
  <rect x="53" y="65" width="794" height="160" rx="16" fill="#f1f4f6" stroke="#d1dbe2"/>
  <text x="85" y="99" class="small">TASK EXECUTION BOUNDARY</text>
  <text x="85" y="134" class="label">Codex Cloud Task</text>
  <text x="85" y="169" class="code">SERVICE_API_KEY = placeholder</text>
  <text x="85" y="198" class="body">The program receives no raw credential through this binding.</text>
  <path d="M310 225V304" fill="none" stroke="#75837a" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="334" y="266" class="body">HTTPS request + placeholder</text>
  <rect x="53" y="318" width="514" height="150" rx="16" fill="#edf4ec" stroke="#bfcfba"/>
  <text x="85" y="351" class="small">TRUSTED REQUEST PATH</text>
  <text x="85" y="388" class="label">Network Proxy</text>
  <text x="85" y="422" class="body">Match Allowed domains → substitute Value</text>
  <rect x="617" y="320" width="230" height="146" rx="14" fill="#fffaf0" stroke="#dfd2b2" stroke-dasharray="5 4"/>
  <text x="732" y="353" text-anchor="middle" class="small">CONFIGURED BINDING</text>
  <text x="732" y="385" text-anchor="middle" class="body">Key · real Value</text>
  <text x="732" y="414" text-anchor="middle" class="body">Allowed domains</text>
  <text x="732" y="443" text-anchor="middle" class="small">Outside the Task process</text>
  <path d="M616 390H576" fill="none" stroke="#75837a" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M310 468V536" fill="none" stroke="#75837a" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="334" y="508" class="body">HTTPS request + real credential</text>
  <rect x="53" y="550" width="794" height="100" rx="16" fill="#fff" stroke="#d2ddd0"/>
  <text x="85" y="588" class="label">Allowed HTTPS Service</text>
  <text x="85" y="620" class="code">api.example.com :443</text>
  <rect x="598" y="578" width="215" height="43" rx="21" fill="#edf4ec"/>
  <text x="705" y="605" text-anchor="middle" class="body green">Receives real credential</text>
</svg>
