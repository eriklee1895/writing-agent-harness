<svg xmlns="http://www.w3.org/2000/svg" width="1923" height="818" viewBox="0 0 1923 818" role="img" aria-labelledby="title desc">
  <title id="title">Meta Muse dynamic editorial cover</title>
  <desc id="desc">A dynamic night-city scene showing a personal AI agent's cloud computer moving along a bright trajectory, with official Meta and Muse marks in a restrained brand lockup.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f4e7db" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#0082fb"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif; }
    </style>
  </defs>
  <image href="meta-muse-cover-v3-bg.png" x="0" y="0" width="1923" height="818" preserveAspectRatio="xMidYMid slice"/>
  <rect x="68" y="55" width="650" height="154" rx="30" fill="url(#panel)" filter="url(#shadow)"/>
  <image href="meta-brand-official.svg" x="105" y="93" width="315" height="69" preserveAspectRatio="xMidYMid meet"/>
  <rect x="458" y="86" width="2" height="78" fill="#9a8e83" opacity="0.46"/>
  <rect x="500" y="91" width="74" height="74" rx="22" fill="#ffffff" opacity="0.74"/>
  <image href="muse-logo-official.svg" x="512" y="103" width="50" height="50" preserveAspectRatio="xMidYMid meet"/>
  <text x="598" y="139" class="sans" font-size="38" font-weight="760" letter-spacing="6" fill="#1c2b33">MUSE</text>
  <rect x="105" y="177" width="508" height="3" rx="2" fill="url(#rule)" opacity="0.86"/>
  <text x="105" y="238" class="sans" font-size="17" font-weight="600" letter-spacing="4" fill="#fff8ef" opacity="0.85">PERSONAL AI AGENT · ALWAYS ON</text>
</svg>
