.ev .dt{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--c)}
.ev.sel .lb{font-weight:600}
.ev.sel .dt{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}

.dbody{margin:0;font-size:15px;line-height:1.6}

    o+='<div class="mark" style="left:'+xa+'px;top:0"></div><div class="mark" style="left:'+xb+'px;top:0"></div>';
    o+='<div class="br" style="left:'+xa+'px;width:'+(xb-xa)+'px;top:0"><span>近 9 个月</span></div>';
    o+='<div class="br b2" style="left:'+xg+'px;width:'+(xb-xg)+'px;top:22px"><span>10 周 5 款</span></div>';
    ovl.innerHTML=o;
    LANES.forEach(function(L,li){
      var last={up:-1e9,down:-1e9}, k=0;
      EV.forEach(function(e,i){
        if(e.l!==li) return;
        var el=evEls[i], lb=el.firstChild, dt=el.lastChild; el.style.width='auto'; var w=Math.ceil(lb.getBoundingClientRect().width), x=X(e.d);
        var pref=(k%2===0)?'up':'down', other=pref==='up'?'down':'up';
        function box(){var l=Math.max(0,Math.min(W-w,x-w/2)); return l;}
        var left=box(), side=pref;
        if(left<last[pref]+6){ if(left>=last[other]+6) side=other; else { left=Math.min(W-w,last[pref]+6); } }
        last[side]=left+w;
        el.style.left=left+'px'; el.style.width=w+'px';
        var dx=x-left-5;
        if(side==='up'){ el.style.top='5px'; lb.style.marginTop='0'; dt.style.left=dx+'px'; dt.style.top='21px'; el.style.height='31px'; }
        else { el.style.top='26px'; dt.style.left=dx+'px'; dt.style.top='0px'; lb.style.marginTop='14px'; el.style.height='32px'; }
        el.dataset.side=side; k++;
      });
    });
  }
  function link(id){var s=S[id]; return '<a href="'+s.u+'" target="_blank" rel="noopener">'+s.l+'</a>';}
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function render(){
    ovBtn.setAttribute('aria-pressed',(state.lane<0&&state.ev<0)?'true':'false');
    laneBtns.forEach(function(b,i){b.setAttribute('aria-pressed',state.lane===i?'true':'false');});
    laneRows.forEach(function(r,i){ r.className='lane'+(state.lane>-1?(state.lane===i?' hl':' dim'):''); });
    evEls.forEach(function(el,i){ el.className='ev'+(state.ev===i?' sel':''); el.setAttribute('aria-pressed',state.ev===i?'true':'false'); });
    var h='';
    if(state.ev>-1){
      var e=EV[state.ev], L=LANES[e.l];
      h='<div class="dhead"><span class="ddate">'+esc(e.dl||e.d)+'</span><span class="chip"><span class="sw" style="background:var(--'+L.k+')"></span>'+esc(L.n)+'</span></div>'+
        '<p class="dtitle">'+esc(e.t)+'</p><p class="dbody">'+esc(e.b)+'</p><p class="dsrc">来源：'+e.s.map(link).join('；')+'</p>';
    } else if(state.lane>-1){
      var L2=LANES[state.lane];
      h='<div class="dhead"><span class="chip"><span class="sw" style="background:var(--'+L2.k+')"></span>'+esc(L2.n)+'</span><span class="chip">推断</span></div>'+
        '<p class="dtitle">'+esc(L2.t)+'</p><p class="dbody">'+esc(L2.b)+'</p>';
    } else {
      h='<div class="dhead"><span class="chip">总览</span><span class="chip">推断</span></div><p class="dtitle">'+esc(OVERVIEW.t)+'</p><p class="dbody">'+esc(OVERVIEW.b)+'</p>';
    }
    detail.innerHTML=h;
  }
  if(window.ResizeObserver){ new ResizeObserver(function(){layout();}).observe(plot); } else { window.addEventListener('resize',layout); }
  layout(); render();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);
})();
</script>
