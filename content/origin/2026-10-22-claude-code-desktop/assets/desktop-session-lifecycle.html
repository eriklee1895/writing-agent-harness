<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>嵌套会话的编排与验收</title><style>:root{color-scheme:light dark;--bg:#fff;--fg:#1f1f1f;--mu:#6b6b6b;--bd:#e3e2de;--card:#f7f6f3;--card2:#f0efed;--gr:#b4b4b0;--blue:#226fba;--blue-bg:#e5f2fc;--green:#28764c;--green-bg:#e8f1ec;--orange:#9a5b22;--orange-bg:#fbebde;--red:#b53a32;--red-bg:#fce9e7}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#e6e6e6;--mu:#9b9b9b;--bd:#343434;--card:#232323;--card2:#30302e;--gr:#5c5c5c;--blue:#8ebff0;--blue-bg:#203348;--green:#8fcba6;--green-bg:#20392b;--orange:#e8b07a;--orange-bg:#3c2d21;--red:#f19a90;--red-bg:#3b2523}}html[data-embed-theme="light"]{--bg:#fff;--fg:#1f1f1f;--mu:#6b6b6b;--bd:#e3e2de;--card:#f7f6f3;--card2:#f0efed;--gr:#b4b4b0;--blue:#226fba;--blue-bg:#e5f2fc;--green:#28764c;--green-bg:#e8f1ec;--orange:#9a5b22;--orange-bg:#fbebde;--red:#b53a32;--red-bg:#fce9e7}html[data-embed-theme="dark"]{--bg:#191919;--fg:#e6e6e6;--mu:#9b9b9b;--bd:#343434;--card:#232323;--card2:#30302e;--gr:#5c5c5c;--blue:#8ebff0;--blue-bg:#203348;--green:#8fcba6;--green-bg:#20392b;--orange:#e8b07a;--orange-bg:#3c2d21;--red:#f19a90;--red-bg:#3b2523}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC",sans-serif}main{max-width:1080px;margin:auto;padding:24px}h1{font-size:23px;line-height:1.4;margin:4px 0 8px;letter-spacing:-.4px}p{margin:0}button,input{font:inherit}button{cursor:pointer;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;min-height:44px;padding:8px 14px;line-height:1.4}button:hover{background:var(--card)}button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button[aria-pressed="true"]{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}button:disabled{opacity:.55;cursor:default}input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue);flex-shrink:0}.eyebrow{font-size:14px;font-weight:650;color:var(--blue)}.intro,.note{font-size:14px;color:var(--mu)}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0}.toolbar .note{margin-left:auto}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.tabs button{flex:1;white-space:nowrap}.panel{border:1px solid var(--bd);border-radius:10px;background:var(--card);padding:16px}.section-label{font-size:14px;color:var(--mu);font-weight:600;margin-bottom:6px}.mono{font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;overflow-wrap:anywhere}.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:5px;font-size:14px;line-height:1.5;padding:2px 8px;white-space:nowrap}.blue{color:var(--blue);background:var(--blue-bg)}.green{color:var(--green);background:var(--green-bg)}.orange{color:var(--orange);background:var(--orange-bg)}.red{color:var(--red);background:var(--red-bg)}.foot{margin-top:12px;font-size:14px;color:var(--mu)}.hidden{display:none!important}.strong{font-weight:650}.separator{height:1px;background:var(--bd);margin:16px 0}.root{border-left:4px solid var(--blue)}.row{display:flex;align-items:center;gap:12px;justify-content:space-between}.row>*{min-width:0}.text-muted{color:var(--mu)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:600px){main{padding:16px}h1{font-size:21px}.toolbar .note{margin-left:0;width:100%}.tabs button{padding:8px;font-size:14px}.panel{padding:12px}.row{gap:8px;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.steps button{font-size:14px;padding:8px}.bridge{text-align:center;color:var(--mu);font-size:14px;padding:10px}.workers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.worker{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;text-align:left;padding:12px}.worker .section-label{margin-bottom:0}.worker .chip{margin-top:4px}.worker.attention{border-color:var(--orange)}.readout{margin-top:16px;border-top:1px solid var(--bd);padding-top:12px;display:grid;gap:4px}.readout p:not(.strong){font-size:14px;color:var(--mu)}.worker-detail{margin-top:4px}@media(max-width:600px){.workers{gap:8px;grid-template-columns:1fr}.worker{display:grid;grid-template-columns:1fr auto;gap:2px 8px}.worker>.section-label{grid-column:1}.worker>.strong{grid-column:1}.worker>.chip{grid-column:2;grid-row:1/3;align-self:center;margin:0}.steps{gap:6px}.steps button{flex:1 1 28%}.bridge{font-size:14px}}
</style></head><body><main aria-label="嵌套会话工作流示意">
<header><p class="eyebrow">交互图解 · 会话编排</p><h1>从任务拆分，到结果验收</h1><p class="intro">假设给视频渲染服务新增 resolution 返回字段。点击阶段，观察人何时介入。</p></header>
<nav class="tabs steps" aria-label="选择演示阶段"><button data-phase="0">明确边界</button><button data-phase="1">并行委派</button><button data-phase="2">处理阻塞</button><button data-phase="3">结果回流</button><button data-phase="4">人工验收</button></nav>
<section class="panel root"><div class="row"><div><p class="section-label">主会话 · 目标与协调</p><p class="strong">为任务结果补充 resolution</p></div><span id="root-state" class="chip blue">需你确认</span></div></section>
<div class="bridge" id="bridge" aria-hidden="true">↓ 分派任务契约 · ↑ 接收结果汇报</div>
<div class="workers" aria-label="点击查看每个子任务"><button class="worker" data-worker="0"><span class="section-label">子会话 A · API 契约</span><span class="strong">核查兼容性</span><span class="chip" id="w0"></span></button><button class="worker" data-worker="1"><span class="section-label">子会话 B · 渲染链路</span><span class="strong">补齐结果字段</span><span class="chip" id="w1"></span></button><button class="worker" data-worker="2"><span class="section-label">子会话 C · 测试</span><span class="strong">验证异常边界</span><span class="chip" id="w2"></span></button></div>
<section class="readout" aria-live="polite"><p class="strong" id="phase-title"></p><p id="phase-text"></p><p class="worker-detail" id="worker-detail"></p></section>
<div class="toolbar"><button id="play">▶ 播放</button><button id="next">下一阶段 →</button><button id="reset">重置</button><p class="note">流程示意，不代表实测耗时或原生 UI</p></div>
</main>
<script>(() => {
const phases=[
{root:'需你确认',states:['确认范围','确认写入范围','确认验证标准'],title:'先定义分工，再开始并行',text:'确定 API 契约与文件归属。子任务不是三个模糊主题，而是三个有输入、边界和交付物的委派。'},
{root:'协调中',states:['执行中','执行中','执行中'],title:'并行的是独立工作，不是互相猜测',text:'各子会话保留自己的执行过程。主会话负责推进目标；代码隔离必须另行配置 worktree。'},
{root:'需要你决策',states:['已汇报','等待确认','执行中'],title:'优先处理真正需要人的阻塞',text:'示例：旋转视频应返回编码尺寸，还是显示尺寸？用户先决定字段语义，再继续实现。'},
{root:'汇总中',states:['已汇报','已汇报','已汇报'],title:'结果回主线，过程留在各自会话',text:'回流内容应能验收：结论、证据位置、改动分支、测试结果和未解决风险，而不是堆完整日志。'},
{root:'待验收',states:['已汇报','已汇报','已汇报'],title:'Agent 完成，不等于可以合并',text:'人检查 diff、测试与契约是否一致，再决定是否提交、开 PR 或合并。此图不假定系统自动解决依赖和冲突。'}];
const details=['A：只读检查调用方、协议定义与兼容风险；交付契约结论及代码证据。','B：仅修改约定的渲染模块；交付实际分支、改动文件与验证命令。','C：使用预先约定的测试范围；交付用例、结果与尚未覆盖的边界。'];
let phase=0,selected=0,timer=null;
const $=s=>document.querySelector(s);
function stop(){clearInterval(timer);timer=null;$('#play').textContent='▶ 播放';$('#play').setAttribute('aria-pressed','false');}
function render(){const p=phases[phase];document.querySelectorAll('[data-phase]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.phase===phase)));$('#root-state').textContent=p.root;$('#root-state').className='chip '+(phase===2?'orange':'blue');p.states.forEach((s,i)=>{const el=$('#w'+i);el.textContent=s;el.className='chip '+(s==='已汇报'?'green':s==='等待确认'?'orange':'blue');const b=$('[data-worker="'+i+'"]');b.classList.toggle('attention',phase===2&&i===1);b.setAttribute('aria-pressed',String(i===selected));});$('#phase-title').textContent=p.title;$('#phase-text').textContent=p.text;$('#worker-detail').textContent=details[selected];$('#next').disabled=phase===4;}
document.querySelectorAll('[data-phase]').forEach(b=>b.addEventListener('click',()=>{stop();phase=+b.dataset.phase;render();}));document.querySelectorAll('[data-worker]').forEach(b=>b.addEventListener('click',()=>{selected=+b.dataset.worker;render();}));$('#next').addEventListener('click',()=>{stop();phase=Math.min(4,phase+1);render();});$('#reset').addEventListener('click',()=>{stop();phase=0;selected=0;render();});$('#play').addEventListener('click',()=>{if(timer){stop();return;}if(phase===4)phase=0;$('#play').textContent='Ⅱ 暂停';$('#play').setAttribute('aria-pressed','true');render();timer=setInterval(()=>{phase=Math.min(4,phase+1);render();if(phase===4)stop();},2200);});
const requested=Number(new URLSearchParams(location.search).get('phase'));if(Number.isInteger(requested)&&requested>=0&&requested<=4)phase=requested;render();
})();
</script></body></html>
