<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Environment 与 Worktree 隔离</title><style>:root{color-scheme:light dark;--bg:#fff;--fg:#1f1f1f;--mu:#6b6b6b;--bd:#e3e2de;--card:#f7f6f3;--card2:#f0efed;--gr:#b4b4b0;--blue:#226fba;--blue-bg:#e5f2fc;--green:#28764c;--green-bg:#e8f1ec;--orange:#9a5b22;--orange-bg:#fbebde;--red:#b53a32;--red-bg:#fce9e7}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#e6e6e6;--mu:#9b9b9b;--bd:#343434;--card:#232323;--card2:#30302e;--gr:#5c5c5c;--blue:#8ebff0;--blue-bg:#203348;--green:#8fcba6;--green-bg:#20392b;--orange:#e8b07a;--orange-bg:#3c2d21;--red:#f19a90;--red-bg:#3b2523}}html[data-embed-theme="light"]{--bg:#fff;--fg:#1f1f1f;--mu:#6b6b6b;--bd:#e3e2de;--card:#f7f6f3;--card2:#f0efed;--gr:#b4b4b0;--blue:#226fba;--blue-bg:#e5f2fc;--green:#28764c;--green-bg:#e8f1ec;--orange:#9a5b22;--orange-bg:#fbebde;--red:#b53a32;--red-bg:#fce9e7}html[data-embed-theme="dark"]{--bg:#191919;--fg:#e6e6e6;--mu:#9b9b9b;--bd:#343434;--card:#232323;--card2:#30302e;--gr:#5c5c5c;--blue:#8ebff0;--blue-bg:#203348;--green:#8fcba6;--green-bg:#20392b;--orange:#e8b07a;--orange-bg:#3c2d21;--red:#f19a90;--red-bg:#3b2523}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC",sans-serif}main{max-width:1080px;margin:auto;padding:24px}h1{font-size:23px;line-height:1.4;margin:4px 0 8px;letter-spacing:-.4px}p{margin:0}button,input{font:inherit}button{cursor:pointer;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;min-height:44px;padding:8px 14px;line-height:1.4}button:hover{background:var(--card)}button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button[aria-pressed="true"]{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}button:disabled{opacity:.55;cursor:default}input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue);flex-shrink:0}.eyebrow{font-size:14px;font-weight:650;color:var(--blue)}.intro,.note{font-size:14px;color:var(--mu)}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0}.toolbar .note{margin-left:auto}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.tabs button{flex:1;white-space:nowrap}.panel{border:1px solid var(--bd);border-radius:10px;background:var(--card);padding:16px}.section-label{font-size:14px;color:var(--mu);font-weight:600;margin-bottom:6px}.mono{font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;overflow-wrap:anywhere}.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:5px;font-size:14px;line-height:1.5;padding:2px 8px;white-space:nowrap}.blue{color:var(--blue);background:var(--blue-bg)}.green{color:var(--green);background:var(--green-bg)}.orange{color:var(--orange);background:var(--orange-bg)}.red{color:var(--red);background:var(--red-bg)}.foot{margin-top:12px;font-size:14px;color:var(--mu)}.hidden{display:none!important}.strong{font-weight:650}.separator{height:1px;background:var(--bd);margin:16px 0}.root{border-left:4px solid var(--blue)}.row{display:flex;align-items:center;gap:12px;justify-content:space-between}.row>*{min-width:0}.text-muted{color:var(--mu)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:600px){main{padding:16px}h1{font-size:21px}.toolbar .note{margin-left:0;width:100%}.tabs button{padding:8px;font-size:14px}.panel{padding:12px}.row{gap:8px;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.options{display:flex;gap:12px 24px;flex-wrap:wrap;padding:0 0 16px}.options label{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;cursor:pointer}.workspace{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--red);border-radius:10px;overflow:hidden;background:var(--red-bg)}.session{padding:16px;min-width:0}.session+ .session{border-left:1px solid var(--bd)}.workspace.isolated{border-color:var(--green);background:var(--green-bg)}.branch{font-size:14px;color:var(--mu);margin-top:8px}.shared{margin-top:12px;padding:12px 16px;background:var(--orange-bg);color:var(--orange);border-left:3px solid var(--orange);font-size:14px;display:grid;gap:4px}.conclusion{margin:16px 0;font-weight:650;color:var(--red)}.conclusion.safe{color:var(--green)}.invariants{border-top:1px solid var(--bd);padding-top:12px;display:flex;gap:8px 16px;justify-content:space-between;font-size:14px;color:var(--mu);flex-wrap:wrap}.invariants .strong{color:var(--fg)}@media(max-width:600px){.workspace{grid-template-columns:1fr}.session+.session{border-left:0;border-top:1px solid var(--bd)}.session{padding:12px}.options{gap:0}.options label{width:100%}.envs .note{margin:0}}
</style></head><body><main aria-label="工作环境与 worktree 隔离示意">
<header><p class="eyebrow">交互图解 · 执行边界</p><h1>Environment 决定在哪跑，Worktree 决定在哪改</h1><p class="intro">切换执行位置与目录选项，观察两个会话是否仍在写同一个地方。</p></header>
<div class="toolbar envs" role="group" aria-label="执行位置"><button data-env="local" aria-pressed="true">Local 本机</button><button data-env="ssh" aria-pressed="false">SSH 远端</button><span class="note" id="host"></span></div>
<div class="options"><label><input type="checkbox" id="worktree">启动前开启 Worktree</label><label><input type="checkbox" id="additional">启动后追加同一个目录</label></div>
<section class="workspace" id="workspace"><div class="session"><p class="section-label">会话 A · 字段实现</p><p class="mono" id="path-a"></p><p class="branch" id="branch-a"></p></div><div class="session"><p class="section-label">会话 B · 回归测试</p><p class="mono" id="path-b"></p><p class="branch" id="branch-b"></p></div></section>
<section id="shared" class="shared hidden"><p class="strong">追加目录仍指向同一原目录</p><p class="mono" id="shared-path"></p><p>“+ Add folder” 不会为这份追加目录自动创建 worktree。</p></section>
<p class="conclusion" id="conclusion" aria-live="polite"></p>
<div class="invariants"><p class="strong">目录分开以后，仍然要单独治理</p><p>数据库 · 端口 · 凭证 · 队列 · 外部 API</p></div>
<p class="foot">目录与分支名仅为示意。Worktree 不是容器，也不是权限、网络或外部资源隔离边界。</p>
</main>
<script>(() => {
let environment='local';const $=s=>document.querySelector(s);function render(){const isolated=$('#worktree').checked,additional=$('#additional').checked;const base=environment==='local'?'~/code/video-service':'/srv/video-service';$('#host').textContent=environment==='local'?'执行：当前电脑':'执行：dev-box（示意主机）';document.querySelectorAll('[data-env]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.env===environment)));$('#path-a').textContent=isolated?base+'/.claude/worktrees/api':base;$('#path-b').textContent=isolated?base+'/.claude/worktrees/tests':base;$('#branch-a').textContent=isolated?'独立工作目录 · 示例分支 claude/api':'原工作目录 · 共享当前检出状态';$('#branch-b').textContent=isolated?'独立工作目录 · 示例分支 claude/tests':'原工作目录 · 共享当前检出状态';$('#workspace').classList.toggle('isolated',isolated);$('#shared').classList.toggle('hidden',!additional);$('#shared-path').textContent=environment==='local'?'~/code/shared-schema':'/srv/shared-schema';$('#conclusion').textContent=isolated?(additional?'主仓库已分开，但追加目录依然共享。':'主仓库工作目录已分开，之后仍可能出现合并冲突。'):'两个会话正在使用同一工作目录：会话独立，不代表文件独立。';$('#conclusion').classList.toggle('safe',isolated&&!additional);}
document.querySelectorAll('[data-env]').forEach(b=>b.addEventListener('click',()=>{environment=b.dataset.env;render();}));$('#worktree').addEventListener('change',render);$('#additional').addEventListener('change',render);const q=new URLSearchParams(location.search);if(q.get('env')==='ssh')environment='ssh';$('#worktree').checked=q.get('worktree')==='on';$('#additional').checked=q.get('additional')==='on';render();
})();
</script></body></html>
