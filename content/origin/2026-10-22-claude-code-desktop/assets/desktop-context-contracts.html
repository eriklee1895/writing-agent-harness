<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>侧聊与任务会话的上下文边界</title><style>:root{color-scheme:light dark;--bg:#fff;--fg:#1f1f1f;--mu:#6b6b6b;--bd:#e3e2de;--card:#f7f6f3;--card2:#f0efed;--gr:#b4b4b0;--blue:#226fba;--blue-bg:#e5f2fc;--green:#28764c;--green-bg:#e8f1ec;--orange:#9a5b22;--orange-bg:#fbebde;--red:#b53a32;--red-bg:#fce9e7}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#e6e6e6;--mu:#9b9b9b;--bd:#343434;--card:#232323;--card2:#30302e;--gr:#5c5c5c;--blue:#8ebff0;--blue-bg:#203348;--green:#8fcba6;--green-bg:#20392b;--orange:#e8b07a;--orange-bg:#3c2d21;--red:#f19a90;--red-bg:#3b2523}}html[data-embed-theme="light"]{--bg:#fff;--fg:#1f1f1f;--mu:#6b6b6b;--bd:#e3e2de;--card:#f7f6f3;--card2:#f0efed;--gr:#b4b4b0;--blue:#226fba;--blue-bg:#e5f2fc;--green:#28764c;--green-bg:#e8f1ec;--orange:#9a5b22;--orange-bg:#fbebde;--red:#b53a32;--red-bg:#fce9e7}html[data-embed-theme="dark"]{--bg:#191919;--fg:#e6e6e6;--mu:#9b9b9b;--bd:#343434;--card:#232323;--card2:#30302e;--gr:#5c5c5c;--blue:#8ebff0;--blue-bg:#203348;--green:#8fcba6;--green-bg:#20392b;--orange:#e8b07a;--orange-bg:#3c2d21;--red:#f19a90;--red-bg:#3b2523}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC",sans-serif}main{max-width:1080px;margin:auto;padding:24px}h1{font-size:23px;line-height:1.4;margin:4px 0 8px;letter-spacing:-.4px}p{margin:0}button,input{font:inherit}button{cursor:pointer;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;min-height:44px;padding:8px 14px;line-height:1.4}button:hover{background:var(--card)}button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button[aria-pressed="true"]{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}button:disabled{opacity:.55;cursor:default}input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue);flex-shrink:0}.eyebrow{font-size:14px;font-weight:650;color:var(--blue)}.intro,.note{font-size:14px;color:var(--mu)}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0}.toolbar .note{margin-left:auto}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.tabs button{flex:1;white-space:nowrap}.panel{border:1px solid var(--bd);border-radius:10px;background:var(--card);padding:16px}.section-label{font-size:14px;color:var(--mu);font-weight:600;margin-bottom:6px}.mono{font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;overflow-wrap:anywhere}.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:5px;font-size:14px;line-height:1.5;padding:2px 8px;white-space:nowrap}.blue{color:var(--blue);background:var(--blue-bg)}.green{color:var(--green);background:var(--green-bg)}.orange{color:var(--orange);background:var(--orange-bg)}.red{color:var(--red);background:var(--red-bg)}.foot{margin-top:12px;font-size:14px;color:var(--mu)}.hidden{display:none!important}.strong{font-weight:650}.separator{height:1px;background:var(--bd);margin:16px 0}.root{border-left:4px solid var(--blue)}.row{display:flex;align-items:center;gap:12px;justify-content:space-between}.row>*{min-width:0}.text-muted{color:var(--mu)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:600px){main{padding:16px}h1{font-size:21px}.toolbar .note{margin-left:0;width:100%}.tabs button{padding:8px;font-size:14px}.panel{padding:12px}.row{gap:8px;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.flow{display:grid;grid-template-columns:minmax(0,1fr) 230px minmax(0,1fr);align-items:center;gap:16px;padding:12px 0 20px}.flow .panel{min-height:100px;display:flex;flex-direction:column;justify-content:center}.destination{border-left:4px solid var(--blue)}.arrows{text-align:center;font-size:14px;color:var(--blue);display:grid;gap:16px}.arrows .no-return{color:var(--mu)}.contract{margin:0;border-top:1px solid var(--bd)}.contract>div{display:grid;grid-template-columns:90px 1fr;gap:16px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}.contract dt{font-weight:650}.contract dd{margin:0;color:var(--mu)}.verdict{margin-top:16px;font-weight:650;color:var(--blue)}@media(max-width:700px){.flow{grid-template-columns:1fr;gap:8px;padding-top:0}.flow .panel{min-height:72px}.arrows{gap:2px;padding:4px}.contract>div{grid-template-columns:72px 1fr;gap:10px}.tabs button{flex-basis:40%}}
</style></head><body><main aria-label="不同会话方式的上下文流向">
<header><p class="eyebrow">交互图解 · 上下文契约</p><h1>都是“分出去”，信息流却不同</h1><p class="intro">切换方式，看带过去什么、带回来什么，以及没有得到哪些保证。</p></header>
<nav class="tabs" aria-label="选择会话方式"><button data-mode="nested">Nested session</button><button data-mode="btw">/btw 侧聊</button><button data-mode="followup">Follow-up 任务</button><button data-mode="message">跨会话消息</button></nav>
<div class="flow"><section class="panel root"><p class="section-label" id="left-label">主会话</p><p class="strong" id="left-text">保留目标与协调</p></section><div class="arrows" aria-label="消息流向"><p id="outbound">任务与必要背景 →</p><p id="inbound">← 完成后的结果汇报</p></div><section class="panel destination"><p class="section-label" id="right-label">嵌套子会话</p><p class="strong" id="right-text">执行独立子任务</p></section></div>
<dl class="contract" aria-live="polite"><div><dt>带过去</dt><dd id="carry"></dd></div><div><dt>带回来</dt><dd id="return"></dd></div><div><dt>关键边界</dt><dd id="boundary"></dd></div></dl>
<p class="verdict" id="verdict"></p><p class="foot">公开行为的概念图，不推断底层实现；这里不是产品界面截图。</p>
</main>
<script>(() => {
const modes={
nested:{leftLabel:'主会话',left:'保留目标与协调',rightLabel:'嵌套子会话',right:'执行独立子任务',out:'任务与必要背景 →',back:'← 完成后的结果汇报',carry:'委派任务及其需要的背景；不是所有会话共享一块上下文。',ret:'官方确认完成后将结果报告回主会话。',boundary:'公开资料未完整说明初始上下文复制策略；嵌套关系也不保证独立 worktree。',verdict:'任务树用于组织委派，不等于共享内存。'},
btw:{leftLabel:'主会话',left:'当前任务继续',rightLabel:'/btw 侧聊',right:'解释、问答、临时探索',out:'创建时的主线程上下文 →',back:'不自动写回主线程',carry:'可读取发起侧聊时已有的主线程上下文。',ret:'不自动带回。重要结论需要用户主动带回主线。',boundary:'支持 local / SSH / WSL；不保存到磁盘，关闭 App 后不能回到该侧聊。',verdict:'侧聊隔离的是提问，不是一个可靠的任务交付通道。'},
followup:{leftLabel:'当前会话',left:'发现范围外的工作',rightLabel:'另一个会话',right:'承接明确的新任务',out:'任务卡 + 启动设置 →',back:'需要协同时再显式沟通',carry:'任务卡描述的新工作；默认沿用当前 environment，可先修改设置。',ret:'不能仅凭卡片就假定所有新决策会实时同步到原会话。',boundary:'Start 启动新会话，Do it here 留在原会话；环境复用不等于项目记忆共享。',verdict:'先判断是否值得做，再决定在哪个会话做。'},
message:{leftLabel:'发送方会话',left:'发出有来源的消息',rightLabel:'接收方会话',right:'按自己的权限规则行动',out:'带发送来源的显式消息 →',back:'← 接收方可以回复',carry:'明确的信息与来源，而不是把两段对话合并为一个上下文。',ret:'接收会话可以回复；正在执行时，消息可能等待当前工作完成。',boundary:'Desktop 会话管理工具与通用 cross-session messaging 的可见范围不同；接收方仍可拒收。',verdict:'消息是新的输入，不是绕过权限的通行证。'}};
const $=s=>document.querySelector(s);function render(key){const m=modes[key];document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===key)));for(const [id,v] of Object.entries({'left-label':m.leftLabel,'left-text':m.left,'right-label':m.rightLabel,'right-text':m.right,'outbound':m.out,'inbound':m.back,'carry':m.carry,'return':m.ret,'boundary':m.boundary,'verdict':m.verdict}))$('#'+id).textContent=v;$('#inbound').classList.toggle('no-return',key==='btw'||key==='followup');}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.mode)));const key=new URLSearchParams(location.search).get('mode');render(modes[key]?key:'nested');
})();
</script></body></html>
