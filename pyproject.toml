[project]
name = "writing-agent-harness"
version = "0.1.0"
description = "Personal AI writing automation harness for research, drafting, visuals, and publishing workflows."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "agno>=2.6.14",
    "anthropic>=0.109.1",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "markdownify>=1.1.0",
    "openai>=2.41.0",
    "pillow>=10.0.0",
    "playwright>=1.1.60.0",
    "requests>=2.34.2",
    "trafilatura>=2.0.0",  # reserved for future generic-article-fetcher skill; not used by wechat-article-fetcher
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
